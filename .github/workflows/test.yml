name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.2.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.8.0

  test:
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-latest]

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.2.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Test without cgo
        env:
          CGO_ENABLED: 0
        run: go test ./internal/utils -run 'TestBatchTrash_(PublicAPIHandlesMissingPath|ReturnsUnsupportedPlatformError)' -count=1

      - name: Verify source build
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          go build -o mac-cleanup-source .
          ./scripts/verify_macos_binary.sh mac-cleanup-source "$(uname -m)"

      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "## Test Coverage: $COVERAGE" >> $GITHUB_STEP_SUMMARY
          echo '<details>' >> $GITHUB_STEP_SUMMARY
          echo '<summary>Details</summary>' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: 2ykwang/mac-cleanup-go
          files: ./coverage.out
          fail_ci_if_error: false
